<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6fb;
}

#app{
    width:100vw;
    height:100vh;
    padding:12px;
    overflow:hidden;
}

/* ---------------- BUTTON ---------------- */

button{
    background:#4CAF50;
    color:#fff;
    border:none;
    padding:8px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#43A047;
}

/* ---------------- CATEGORY ---------------- */

.category-grid{

    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:18px;
    margin-top:15px;

}

.category-card{

    background:#fff;
    border-radius:15px;
    padding:22px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    transition:.2s;

}

.category-card:hover{

    transform:translateY(-5px);

}

.emoji{

    font-size:58px;
    margin-bottom:10px;

}

/* ======================================================
   WORD PAGE
====================================================== */

.detail-card{

    height:calc(100vh - 55px);

    background:#fff;

    border-radius:20px;

    padding:18px;

    margin-top:8px;

    box-shadow:0 8px 18px rgba(0,0,0,.08);

    display:flex;

    flex-direction:column;

    overflow:hidden;

}

/* -------- LEFT + RIGHT -------- */

.detail-layout{

    flex:1;

    display:grid;

    grid-template-columns:340px 1fr;

    gap:25px;

    overflow:hidden;

}

/* -------- LEFT -------- */

.detail-left{

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    padding:10px;

}

/* IMAGE */

.word-image{

    width:250px;

    height:250px;

    object-fit:contain;

}

/* WORD */

.word-title{

    margin-top:15px;

    font-size:42px;

    font-weight:bold;

}

.word-ipa{

    margin-top:6px;

    font-size:22px;

    color:#666;

}

/* -------- RIGHT -------- */

.detail-right{

    display:flex;

    flex-direction:column;

    justify-content:center;

    padding-right:10px;

}

.info-table{

    width:100%;

    border-collapse:collapse;

    font-size:15px;

}

.info-table td{

    padding:6px 8px;

    border-bottom:1px solid #eee;

    vertical-align:top;

    line-height:1.2;

}

.info-table td:first-child{

    width:170px;

    font-weight:bold;

}

/* FUN FACT */

.fun-fact{

    margin-top:10px;

    padding:10px 14px;

    background:#FFF7D6;

    border-left:4px solid orange;

    border-radius:10px;

    font-size:15px;

    line-height:1.3;

}

/* NAVIGATION */

.nav-buttons{

    display:flex;

    justify-content:space-between;

    margin-top:12px;

}

/* MOBILE */

@media(max-width:900px){

html,
body{

    overflow:auto;

}

#app{

    overflow:auto;

    height:auto;

}

.detail-card{

    height:auto;

}

.detail-layout{

    grid-template-columns:1fr;

}

.detail-left{

    margin-bottom:15px;

}

.word-image{

    width:180px;

    height:180px;

}

.word-title{

    font-size:32px;

}

.word-ipa{

    font-size:18px;

}

.info-table{

    font-size:14px;

}

}

/* ---------- SPEAKER ICONS ---------- */

.word-speak{

    margin-top:12px;
    font-size:30px;
    cursor:pointer;
    color:#2196F3;
    transition:.2s;

}

.word-speak:hover{

    transform:scale(1.2);

}

.speak-cell{

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;

}

.row-speak{

    cursor:pointer;
    font-size:18px;
    color:#2196F3;
    flex-shrink:0;
    transition:.2s;

}

.row-speak:hover{

    transform:scale(1.2);

}

.progress{

    text-align:center;

    font-size:18px;

    font-weight:bold;

    color:#555;

    margin:10px 0 18px;

}

</style>
