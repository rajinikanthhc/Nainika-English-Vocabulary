<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6fb;
}

#app{
    width:100vw;
    height:100vh;
    padding:15px;
    overflow:hidden;
}

/* ---------------- BUTTON ---------------- */

button{
    background:#4CAF50;
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#43A047;
}

/* ---------------- CATEGORY ---------------- */

.category-grid{

    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:20px;
    margin-top:20px;

}

.category-card{

    background:#fff;
    border-radius:16px;
    padding:25px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    transition:.2s;

}

.category-card:hover{

    transform:translateY(-5px);

}

.emoji{

    font-size:60px;
    margin-bottom:12px;

}

/* ==========================================================
   WORD PAGE
========================================================== */

.detail-card{

    height:calc(100vh - 70px);

    margin-top:10px;

    background:#fff;

    border-radius:20px;

    padding:20px;

    box-shadow:0 8px 18px rgba(0,0,0,.08);

    display:flex;

    flex-direction:column;

    overflow:hidden;

}

.detail-layout{

    flex:1;

    display:grid;

    grid-template-columns:280px 1fr;

    gap:25px;

    overflow:hidden;

}

/* ---------- LEFT ---------- */

.detail-left{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

}

.word-image{

    width:180px;

    height:180px;

    object-fit:contain;

}

.word-title{

    margin-top:15px;

    font-size:34px;

}

.word-ipa{

    margin-top:6px;

    font-size:18px;

    color:#666;

}

/* ---------- RIGHT ---------- */

.detail-right{
    overflow-y:auto;
    padding-right:8px;
}

.info-table{

    width:100%;

    border-collapse:collapse;

    font-size:15px;

}

.info-table td{

    padding:7px 10px;

    border-bottom:1px solid #eee;

}

.info-table td:first-child{

    width:170px;

    font-weight:bold;

}

.fun-fact{

    margin-top:10px;

    padding:10px;

    background:#FFF7D6;

    border-left:4px solid orange;

    border-radius:10px;

    font-size:15px;

}

/* ---------- NAVIGATION ---------- */

.nav-buttons{

    display:flex;

    justify-content:space-between;

    margin-top:12px;

}

</style>
