<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6fb;
}

#app{
    width:100%;
    min-height:100vh;
    padding:20px;
}

/* ---------- Buttons ---------- */

button{
    background:#4CAF50;
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#43A047;
}

/* ---------- Category Grid ---------- */

.category-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:20px;
    margin-top:20px;
}

.category-card{
    background:#fff;
    border-radius:15px;
    padding:25px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    transition:.2s;
}

.category-card:hover{
    transform:translateY(-5px);
}

.emoji{
    font-size:60px;
    margin-bottom:10px;
}

/* =======================================================
   WORD DETAIL PAGE
======================================================= */

.detail-card{

    width:100%;
    background:#fff;
    border-radius:20px;
    padding:25px;
    margin-top:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);

}

/* LEFT IMAGE + RIGHT DETAILS */

.detail-layout{

    display:grid;
    grid-template-columns:300px 1fr;
    gap:35px;
    align-items:start;

}

.detail-left{

    text-align:center;

}

.detail-right{

    width:100%;

}

/* IMAGE */

.word-image{

    width:260px;
    height:260px;
    object-fit:contain;
    display:block;
    margin:auto;

}

/* TITLE */

.word-title{

    font-size:42px;
    margin-top:15px;

}

/* IPA */

.word-ipa{

    font-size:20px;
    color:#666;
    margin-top:5px;

}

/* TABLE */

.info-table{

    width:100%;
    border-collapse:collapse;
    font-size:18px;

}

.info-table td{

    padding:10px;
    border-bottom:1px solid #eee;
    vertical-align:top;

}

.info-table td:first-child{

    width:180px;
    font-weight:bold;

}

/* FUN FACT */

.fun-fact{

    margin-top:20px;
    background:#FFF7D6;
    padding:15px;
    border-left:5px solid orange;
    border-radius:10px;

}

/* NAVIGATION */

.nav-buttons{

    display:flex;
    justify-content:space-between;
    margin-top:25px;

}

/* RESPONSIVE */

@media (max-width:900px){

.detail-layout{

    grid-template-columns:1fr;

}

.detail-left{

    text-align:center;

}

.word-image{

    width:220px;
    height:220px;

}

.word-title{

    font-size:34px;

}

.info-table{

    font-size:16px;

}

}

</style>
