<script>

let categories = [];
let vocabulary = [];
let currentCategory = "";

google.script.run
.withSuccessHandler(function(data){

    categories = data;

    google.script.run
    .withSuccessHandler(function(words){

        vocabulary = words;

        showCategories();

    })
    .getVocabulary();

})
.getCategories();

function showCategories(){

    let html = "<h1>📚 Nainika English Vocabulary</h1>";

    html += "<div class='grid'>";

    categories.forEach(c=>{

        html += `

        <div class="card" onclick="loadLevels('${c.Category}')">

            <div class="emoji">${c.Emoji}</div>

            <h2>${c.Category}</h2>

            <p>${c.Words} Words</p>

        </div>

        `;

    });

    html += "</div>";

    document.getElementById("app").innerHTML = html;

}

const levels = [

    {emoji:"🌱",name:"Beginner"},
    {emoji:"📘",name:"Reader"},
    {emoji:"🧩",name:"Builder"},
    {emoji:"🔍",name:"Explorer"},
    {emoji:"🏆",name:"Master"}

];

function loadLevels(category){

    currentCategory = category;

    showLevels();

}

function showLevels(){

    let html = `

    <button onclick="showCategories()">← Back</button>

    <h1>${currentCategory}</h1>

    <div class="grid">

    `;

    levels.forEach(level=>{

        html += `

        <div class="card" onclick="loadWordList('${level.name}')">

            <div class="emoji">${level.emoji}</div>

            <h2>${level.name}</h2>

        </div>

        `;

    });

    html += "</div>";

    document.getElementById("app").innerHTML = html;

}

function loadWordList(level){

    const words = vocabulary.filter(w =>

        w.Category == currentCategory &&
        w.Level == level

    );

    showWordList(level, words);

}

function showWordList(level, words){

    let html = `

    <button onclick="showLevels()">← Back</button>

    <h1>${currentCategory}</h1>

    <h2>${level}</h2>

    <div class="grid">

    `;

    words.forEach(w=>{

        html += `

        <div class="card">

            <h2>${w.Word}</h2>

            <p>${w.Meaning}</p>

        </div>

        `;

    });

    html += "</div>";

    document.getElementById("app").innerHTML = html;

}

</script>
