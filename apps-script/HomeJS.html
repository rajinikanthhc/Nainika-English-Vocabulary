<script>

let categories = [];
let vocabulary = [];
let currentCategory = "";
let currentWords = [];
let currentIndex = 0;
let currentLevel = "";
let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
let isFavoriteMode = false;
let searchText = "";
let searchMode = false;

const IMAGE_BASE =
"https://raw.githubusercontent.com/rajinikanthhc/images/main/";

google.script.run
.withSuccessHandler(function(data){

    categories = data;

    google.script.run
    .withSuccessHandler(function(words){

        vocabulary = words;

        showCategories();

    })
    .getVocabulary();

})
.getCategories();

function getCategoryEmoji(category){

    const icons = {

        "Actions":"🏃",
        "Animals":"🐶",
        "Body Parts":"🖐️",
        "Clothes":"👕",
        "Describing Words":"💬",
        "Events":"🎉",
        "Fantasy":"🧚",
        "Feelings":"😊",
        "Food":"🍔",
        "Fruits":"🍎",
        "Geography":"🌍",
        "Home":"🏠",
        "Music":"🎵",
        "Nature":"🌳",
        "Nouns":"📖",
        "People":"👨",
        "Places":"📍",
        "Position":"↔️",
        "School":"🏫",
        "Sight Word":"👀",
        "Sight Words":"👀",
        "Sports":"⚽",
        "Time":"🕒",
        "Tools":"🛠️",
        "Toys":"🧸",
        "Transport":"🚗",
        "Vegetables":"🥕"

    };

    return icons[category] || "📚";

}

function showCategories(){

    let html = `

<div class="home-page">

<div class="home-header">

<h1>📚 Nainika English Vocabulary</h1>

<div class="home-toolbar">

<button onclick="showFavorites()">
⭐ Favorite Words
</button>

<button onclick="showSearchPage()">
🔍 Search Words
</button>

</div>

</div>

<div class="home-content">

<div class="category-grid">

`;

    categories.forEach(c=>{

        html += `

<div class="category-card"
onclick="loadLevels('${c.Category}')">

<div class="emoji">
    ${getCategoryEmoji(c.Category)}
</div>

<h2>${c.Category}</h2>

<p>${c.Words} Words</p>

</div>

`;

    });

    html += `

</div>

</div>

</div>

`;

    document.getElementById("app").innerHTML = html;

}

const levels = [

    {emoji:"🌱",name:"Beginner"},
    {emoji:"📘",name:"Reader"},
    {emoji:"🧩",name:"Builder"},
    {emoji:"🔍",name:"Explorer"},
    {emoji:"🏆",name:"Master"}

];

function loadLevels(category){

    currentCategory = category;

    showLevels();

}

function showLevels(){

    let html = `

    <button onclick="showCategories()">← Back</button>

    <h1>${currentCategory}</h1>

    <div class="category-grid">

    `;

    levels.forEach(level=>{

        html += `

        <div class="category-card" onclick="loadWordList('${level.name}')">

            <div class="emoji">${level.emoji}</div>

            <h2>${level.name}</h2>

        </div>

        `;

    });

    html += "</div>";

    document.getElementById("app").innerHTML = html;

}

function loadWordList(level){

    isFavoriteMode = false;

     currentLevel = level;

    const words = vocabulary.filter(w =>

        w.Category == currentCategory &&
        w.Level == level

    );

    showWordList(level, words);

}

function showWordList(level, words){

    currentWords = words;

    let html = `

    <button onclick="showLevels()">← Back</button>

    <h1>${currentCategory}</h1>

    <h2>${level}</h2>

    <button onclick="shuffleWords()">🔀 Shuffle</button>

    <div class="category-grid">

    `;

    words.forEach((w,index)=>{

        html += `

        <div class="category-card" onclick="showWord(${index})">

            <h2>${w.Word}</h2>

            <p>${w.Meaning}</p>

        </div>

        `;

    });

    html += "</div>";

    document.getElementById("app").innerHTML = html;

}

function showFavorites(){

    isFavoriteMode = true;

    currentCategory = "⭐ Favorites";
    currentLevel = "";

    currentWords = vocabulary.filter(w =>
        favorites.includes(w.Word)
    );

    let html = `

<button onclick="showCategories()">
← Back
</button>

<h1>⭐ Favorite Words</h1>

<div class="category-grid">

`;

    if(currentWords.length===0){

        html += `

<div class="category-card">

<h2>No favorite words</h2>

<p>Tap ☆ beside a word.</p>

</div>

`;

    }else{

        currentWords.forEach((w,index)=>{

            html += `

<div class="category-card"
onclick="showWord(${index})">

<h2>${w.Word}</h2>

<p>${w.Meaning}</p>

</div>

`;

        });

    }

    html += "</div>";

    document.getElementById("app").innerHTML = html;

}

function showSearchPage(){

    searchMode = true;

    let html = `

<button onclick="goHomeFromSearch()">
← Back
</button>

<h1>🔍 Search Words</h1>

<input
id="searchInput"
type="text"
placeholder="Start typing..."
value="${searchText}"
onkeyup="filterSearch(this.value)"
autocomplete="off">

<div id="searchList" class="category-grid"></div>

`;

    document.getElementById("app").innerHTML = html;

    document.getElementById("searchInput").focus();

    filterSearch(searchText);

}

function filterSearch(text){

    searchText = text;

    currentCategory = "🔍 Search";
    currentLevel = "";

    currentWords = vocabulary.filter(w =>
        w.Word.toLowerCase().startsWith(text.toLowerCase())
    );

    let html="";

    currentWords.forEach((w,index)=>{

        html+=`

<div class="category-card"
onclick="showWord(${index})">

<h2>${w.Word}</h2>

<p>${w.Meaning}</p>

</div>

`;

    });

    document.getElementById("searchList").innerHTML=html;

}

function goHomeFromSearch(){

    searchMode=false;

    searchText="";

    showCategories();

}

function shuffleWords(){

    for(let i=currentWords.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [currentWords[i],currentWords[j]]=
        [currentWords[j],currentWords[i]];

    }

    currentIndex=0;

    showWord(0);

}

function showWord(index){

    currentIndex = index;

    const w = currentWords[index];

    let html = `

<div class="detail-card">

    <div class="top-bar">

    <button onclick="goBack()">
        ← Back
    </button>

    <div class="progress">
        ${currentCategory} • ${currentLevel} •
        ${currentIndex + 1}/${currentWords.length}
    </div>

</div>

    <div class="detail-layout">

        <!-- LEFT -->

        <div class="detail-left">

            <img
                class="word-image"
                src="${IMAGE_BASE + w.Image}">

            <div class="word-header">

    <h1 class="word-title">
        ${w.Word}
    </h1>

    <span class="favorite"
      onclick="toggleFavorite('${w.Word}')">

    ${isFavorite(w.Word) ? "⭐" : "☆"}

</span>

</div>

            <div class="word-ipa">${w.IPA}</div>

<div class="word-speak"
     onclick="speakText('${w.Word}')"
     title="Speak Word">
    🔊
</div>

        </div>

        <!-- RIGHT -->

        <div class="detail-right">

            <table class="info-table">

                <tr>
    <td>📖 Meaning</td>
    <td class="speak-cell">
        <span>${w.Meaning}</span>
        <span class="row-speak"
              onclick="speakText('${w.Meaning}')">🔊</span>
    </td>
</tr>

                <tr>
    <td>🇮🇳 Kannada</td>
    <td class="speak-cell">
        <span>${w.Kannada}</span>
        <span class="row-speak"
              onclick="speakKannada('${w.Kannada}')">🔊</span>
    </td>
</tr>

                <tr>
    <td>💬 Sentence</td>
    <td class="speak-cell">
        <span>${w.Sentence}</span>
        <span class="row-speak"
              onclick="speakText('${w.Sentence}')">🔊</span>
    </td>
</tr>

                <tr>
                    <td>🤝 Friend Word</td>
                    <td>${w.FriendWord}</td>
                </tr>

                <tr>
                    <td>↔ Opposite</td>
                    <td>${w.Opposite}</td>
                </tr>

                <tr>
                    <td>🎵 Rhyming</td>
                    <td>${w.Rhyming}</td>
                </tr>

                <tr>
                    <td>🔤 Phonics</td>
                    <td>${w.Phonics}</td>
                </tr>

                <tr>
                    <td>🔢 Syllables</td>
                    <td>${w.Syllables}</td>
                </tr>

                <tr>
                    <td>👨‍👩‍👧 Word Family</td>
                    <td>${w.WordFamily}</td>
                </tr>

            </table>

            <div class="fun-fact">

                ⭐ <b>Fun Fact</b><br><br>

                ${w.FunFact}

            </div>

        </div>

    </div>

    <div class="nav-buttons">

        <button onclick="previousWord()">⬅ Previous</button>

        <button onclick="nextWord()">Next ➡</button>

    </div>

</div>

`;

    document.getElementById("app").innerHTML = html;

}

function previousWord(){

    if(currentIndex>0){

        showWord(currentIndex-1);

    }

}

function nextWord(){

    if(currentIndex<currentWords.length-1){

        showWord(currentIndex+1);

    }

}

function goBack(){

    if(searchMode){

        showSearchPage();
        return;

    }

    if(isFavoriteMode){

        showFavorites();
        return;

    }

    showWordList(currentLevel,currentWords);

}

function isFavorite(word){

    return favorites.includes(word);

}

function toggleFavorite(word){

    if(isFavorite(word)){

        favorites = favorites.filter(w => w !== word);

    }else{

        favorites.push(word);

    }

    localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
    );

    showWord(currentIndex);

}

function speakText(text){

    speechSynthesis.cancel();

    const msg = new SpeechSynthesisUtterance(text);

    msg.lang = "en-US";

    msg.rate = 0.75;

    msg.pitch = 1;

    speechSynthesis.speak(msg);

}

function speakKannada(text){

    speechSynthesis.cancel();

    const msg = new SpeechSynthesisUtterance(text);

    msg.lang = "kn-IN";

    msg.rate = 0.75;

    speechSynthesis.speak(msg);

}

</script>
