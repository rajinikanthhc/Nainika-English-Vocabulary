<script>

let categories = [];
let vocabulary = [];
let currentCategory = "";
let currentWords = [];
let currentIndex = 0;

const IMAGE_BASE =
"https://raw.githubusercontent.com/rajinikanthhc/images/main/";

google.script.run
.withSuccessHandler(function(data){

    categories = data;

    google.script.run
    .withSuccessHandler(function(words){

        vocabulary = words;

        showCategories();

    })
    .getVocabulary();

})
.getCategories();

function showCategories(){

    let html = "<h1>📚 Nainika English Vocabulary</h1>";

    html += "<div class='grid'>";

    categories.forEach(c=>{

        html += `

        <div class="card" onclick="loadLevels('${c.Category}')">

            <div class="emoji">${c.Emoji}</div>

            <h2>${c.Category}</h2>

            <p>${c.Words} Words</p>

        </div>

        `;

    });

    html += "</div>";

    document.getElementById("app").innerHTML = html;

}

const levels = [

    {emoji:"🌱",name:"Beginner"},
    {emoji:"📘",name:"Reader"},
    {emoji:"🧩",name:"Builder"},
    {emoji:"🔍",name:"Explorer"},
    {emoji:"🏆",name:"Master"}

];

function loadLevels(category){

    currentCategory = category;

    showLevels();

}

function showLevels(){

    let html = `

    <button onclick="showCategories()">← Back</button>

    <h1>${currentCategory}</h1>

    <div class="grid">

    `;

    levels.forEach(level=>{

        html += `

        <div class="card" onclick="loadWordList('${level.name}')">

            <div class="emoji">${level.emoji}</div>

            <h2>${level.name}</h2>

        </div>

        `;

    });

    html += "</div>";

    document.getElementById("app").innerHTML = html;

}

function loadWordList(level){

    const words = vocabulary.filter(w =>

        w.Category == currentCategory &&
        w.Level == level

    );

    showWordList(level, words);

}

function showWordList(level, words){

    currentWords = words;

    let html = `

    <button onclick="showLevels()">← Back</button>

    <h1>${currentCategory}</h1>

    <h2>${level}</h2>

    <div class="grid">

    `;

    words.forEach((w,index)=>{

        html += `

        <div class="card" onclick="showWord(${index})">

            <h2>${w.Word}</h2>

            <p>${w.Meaning}</p>

        </div>

        `;

    });

    html += "</div>";

    document.getElementById("app").innerHTML = html;

}

function showWord(index){

    currentIndex = index;

    const w = currentWords[index];

    let html = `

<button onclick="showWordList('${w.Level}',currentWords)">← Back</button>

<div class="card" style="max-width:1100px;margin:20px auto;padding:30px;">

<div style="display:flex;gap:40px;align-items:flex-start;">

    <!-- LEFT -->

    <div style="flex:1;text-align:center;">

        <img
        src="${IMAGE_BASE+w.Image}"
        style="
        width:320px;
        height:320px;
        object-fit:contain;
        border-radius:15px;
        ">

        <h1 style="margin-top:20px;font-size:42px;">
        ${w.Word}
        </h1>

        <div style="font-size:22px;color:#666;">
        ${w.IPA}
        </div>

    </div>


    <!-- RIGHT -->

    <div style="flex:1.4;font-size:20px;line-height:1.8;">

        <p><b>📖 Meaning</b><br>${w.Meaning}</p>

        <p><b>🇮🇳 Kannada</b><br>${w.Kannada}</p>

        <p><b>💬 Sentence</b><br>${w.Sentence}</p>

        <hr>

        <table style="width:100%;font-size:18px;">

            <tr>
                <td><b>🤝 Friend</b></td>
                <td>${w.FriendWord}</td>
            </tr>

            <tr>
                <td><b>↔ Opposite</b></td>
                <td>${w.Opposite}</td>
            </tr>

            <tr>
                <td><b>🎵 Rhyming</b></td>
                <td>${w.Rhyming}</td>
            </tr>

            <tr>
                <td><b>🔤 Phonics</b></td>
                <td>${w.Phonics}</td>
            </tr>

            <tr>
                <td><b>🔊 Syllables</b></td>
                <td>${w.Syllables}</td>
            </tr>

            <tr>
                <td><b>👨‍👩‍👧 Word Family</b></td>
                <td>${w.WordFamily}</td>
            </tr>

        </table>

        <hr>

        <p>
        ⭐ <b>Fun Fact</b><br>
        ${w.FunFact}
        </p>

    </div>

</div>

<div style="margin-top:30px;display:flex;justify-content:space-between;">

    <button onclick="previousWord()">⬅ Previous</button>

    <button onclick="nextWord()">Next ➡</button>

</div>

</div>

`;
document.getElementById("app").innerHTML = html;

}

function previousWord(){

    if(currentIndex>0){

        showWord(currentIndex-1);

    }

}

function nextWord(){

    if(currentIndex<currentWords.length-1){

        showWord(currentIndex+1);

    }

}

</script>
