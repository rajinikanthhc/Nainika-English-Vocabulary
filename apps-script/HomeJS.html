<script>

let categories = [];
let vocabulary = [];
let currentCategory = "";
let currentWords = [];
let currentIndex = 0;

const IMAGE_BASE =
"https://raw.githubusercontent.com/rajinikanthhc/images/main/";

google.script.run
.withSuccessHandler(function(data){

    categories = data;

    google.script.run
    .withSuccessHandler(function(words){

        vocabulary = words;

        showCategories();

    })
    .getVocabulary();

})
.getCategories();

function showCategories(){

    let html = "<h1>📚 Nainika English Vocabulary</h1>";

    html += "<div class='category-grid'>";

    categories.forEach(c=>{

        html += `

        <div class="category-card" onclick="loadLevels('${c.Category}')">

            <div class="emoji">${c.Emoji}</div>

            <h2>${c.Category}</h2>

            <p>${c.Words} Words</p>

        </div>

        `;

    });

    html += "</div>";

    document.getElementById("app").innerHTML = html;

}

const levels = [

    {emoji:"🌱",name:"Beginner"},
    {emoji:"📘",name:"Reader"},
    {emoji:"🧩",name:"Builder"},
    {emoji:"🔍",name:"Explorer"},
    {emoji:"🏆",name:"Master"}

];

function loadLevels(category){

    currentCategory = category;

    showLevels();

}

function showLevels(){

    let html = `

    <button onclick="showCategories()">← Back</button>

    <h1>${currentCategory}</h1>

    <div class="category-grid">

    `;

    levels.forEach(level=>{

        html += `

        <div class="category-card" onclick="loadWordList('${level.name}')">

            <div class="emoji">${level.emoji}</div>

            <h2>${level.name}</h2>

        </div>

        `;

    });

    html += "</div>";

    document.getElementById("app").innerHTML = html;

}

function loadWordList(level){

    const words = vocabulary.filter(w =>

        w.Category == currentCategory &&
        w.Level == level

    );

    showWordList(level, words);

}

function showWordList(level, words){

    currentWords = words;

    let html = `

    <button onclick="showLevels()">← Back</button>

    <h1>${currentCategory}</h1>

    <h2>${level}</h2>

    <div class="category-grid">

    `;

    words.forEach((w,index)=>{

        html += `

        <div class="category-card" onclick="showWord(${index})">

            <h2>${w.Word}</h2>

            <p>${w.Meaning}</p>

        </div>

        `;

    });

    html += "</div>";

    document.getElementById("app").innerHTML = html;

}

function showWord(index){

    currentIndex = index;

    const w = currentWords[index];

    let html = `

<div class="detail-card">

    <button onclick="showWordList('${w.Level}',currentWords)">← Back</button>

    <div class="detail-layout">

        <!-- LEFT -->

        <div class="detail-left">

            <img
                class="word-image"
                src="${IMAGE_BASE + w.Image}">

            <h1 class="word-title">${w.Word}</h1>

            <div class="word-ipa">${w.IPA}</div>

        </div>

        <!-- RIGHT -->

        <div class="detail-right">

            <table class="info-table">

                <tr>
                    <td>📖 Meaning</td>
                    <td>${w.Meaning}</td>
                </tr>

                <tr>
                    <td>🇮🇳 Kannada</td>
                    <td>${w.Kannada}</td>
                </tr>

                <tr>
                    <td>💬 Sentence</td>
                    <td>${w.Sentence}</td>
                </tr>

                <tr>
                    <td>🤝 Friend Word</td>
                    <td>${w.FriendWord}</td>
                </tr>

                <tr>
                    <td>↔ Opposite</td>
                    <td>${w.Opposite}</td>
                </tr>

                <tr>
                    <td>🎵 Rhyming</td>
                    <td>${w.Rhyming}</td>
                </tr>

                <tr>
                    <td>🔤 Phonics</td>
                    <td>${w.Phonics}</td>
                </tr>

                <tr>
                    <td>🔊 IPA</td>
                    <td>${w.IPA}</td>
                </tr>

                <tr>
                    <td>🔢 Syllables</td>
                    <td>${w.Syllables}</td>
                </tr>

                <tr>
                    <td>👨‍👩‍👧 Word Family</td>
                    <td>${w.WordFamily}</td>
                </tr>

            </table>

            <div class="fun-fact">

                ⭐ <b>Fun Fact</b><br><br>

                ${w.FunFact}

            </div>

        </div>

    </div>

    <div class="nav-buttons">

        <button onclick="previousWord()">⬅ Previous</button>

        <button onclick="nextWord()">Next ➡</button>

    </div>

</div>

`;

    document.getElementById("app").innerHTML = html;

}

function previousWord(){

    if(currentIndex>0){

        showWord(currentIndex-1);

    }

}

function nextWord(){

    if(currentIndex<currentWords.length-1){

        showWord(currentIndex+1);

    }

}

</script>
