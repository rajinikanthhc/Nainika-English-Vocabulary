<script>

let categories = [];

let vocabulary = [];

google.script.run
.withSuccessHandler(function(data){

categories = data;

google.script.run
.withSuccessHandler(function(words){

vocabulary = words;

showCategories(categories);

})
.getVocabulary();

})
.getCategories();

function showCategories(data){

let html="<h1>📚 Nainika English Vocabulary</h1>";

html+="<div class='grid'>";

data.forEach(c=>{

html+=`

<div class="card" onclick="loadLevels('${c.Category}')">

<div class="emoji">${c.Emoji}</div>

<h2>${c.Category}</h2>

<p>${c.Words} Words</p>

</div>

`;

});

html+="</div>";

document.getElementById("app").innerHTML=html;

}

function loadLevels(category){

google.script.run
.withSuccessHandler(function(levels){

showLevels(category,levels);

})
.getLevels();

}

function showLevels(category,levels){

let html=`

<button onclick="location.reload()">← Back</button>

<h1>${category}</h1>

<div class="grid">

`;

levels.forEach(level=>{

html+=`

<div class="card" onclick="loadWordList('${category}','${level.name}')">

<div class="emoji">${level.emoji}</div>

<h2>${level.name}</h2>

</div>

`;

});

html+="</div>";

document.getElementById("app").innerHTML=html;

}

function loadWordList(category,level){

const words=vocabulary.filter(w=>

w.Category==category &&

w.Level==level

);

showWordList(category,level,words);

}

function showWordList(category, level, words){

let html=`

<button onclick="loadLevels('${category}')">← Back</button>

<h1>${category}</h1>

<h2>${level}</h2>

<div class="grid">

`;

words.forEach(w=>{

html+=`

<div class="card">

<h2>${w.Word}</h2>

<p>${w.Meaning}</p>

</div>

`;

});

html+="</div>";

document.getElementById("app").innerHTML=html;

}

</script>
